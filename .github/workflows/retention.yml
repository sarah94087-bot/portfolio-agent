# The daily deletions the privacy page promises (docs/10-ops-and-costs.md, section 5;
# backend/portfolio_agent/retention.py), and the numbers of /stats (daily_metrics.py) just before
# them. It spends no model tokens. A failed run is the alert: GitHub emails it, and anything left
# over is picked up by the next run.
#
# Scheduled runs happen only from main. GitHub turns a schedule off after 60 days with no activity
# in a public repository, and asks by email to keep it on.
#
# Secrets: DATABASE_URL_DIRECT. For deleting traces also LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY
# and, outside the default EU cloud, LANGFUSE_HOST. Without the keys their deletions wait in the
# database.
name: retention

on:
  schedule:
    - cron: "23 2 * * *"  # off the hour, when GitHub's scheduler is less busy
  workflow_dispatch:

concurrency:
  group: retention
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e backend
      # Before the deletions, so a 30-day window is still whole.
      - name: Compute the public metrics
        run: python -m portfolio_agent.daily_metrics
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      # A failure above still fails the run, and the deletions happen regardless.
      - name: Delete what is past its retention period
        if: ${{ !cancelled() }}
        run: python -m portfolio_agent.retention
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
