# The runs that spend Groq tokens, started by hand from the Actions tab. They run here because
# the home network intercepts TLS to api.groq.com (Netspark, since 2026-11-04), and the Groq
# key must never pass through it. Each run pushes what it saved to a branch of its own,
# groq/<job>-<run id>, to be read and merged by hand; nothing is pushed to main.
#
# - stage4: one run of the retrieval stage 4 reranker (evals/retrieval/run_stage4.py). It runs
#   on `ref`, the commit run 1 used (dca8892, 16 records), since a different corpus changes the
#   candidates and so drops the saved rankings. It resumes from the run's saved file and stops
#   at `max_tokens`, so a run can take more than one day.
# - t1: the live T1 (docs/03-evaluation-methodology.md, section 7) on main, Groq with the judge,
#   with R3 search: the embedding model is fetched by hash and the knowledge base loaded.
# - d3: the job match set (evals/jobmatch/run.py) on the branch it is started from. About 7,000
#   tokens a job, at most `max_tokens`. Its results stay in the run: the summary and an artifact.
#
# - d3img: the same postings as screenshots (evals/jobmatch/image_run.py, ADR-0022): the vision
#   model reads 14 pictures, and stage 1 runs on what it read. About 3,500 tokens a picture, 2,048
#   of them the picture. The vision model is also the chat's backup model, so it shares that
#   day's 200,000 tokens with the live site: check the day's other runs first.
#
# One at a time: the Groq quota is per model and per day, shared by both jobs.
name: groq

on:
  workflow_dispatch:
    inputs:
      job:
        description: "stage4, t1, d3 or d3img"
        type: choice
        options: [stage4, t1, d3, d3img]
        default: stage4
      run:
        description: "stage4: the run number (2 or 3)"
        default: "2"
      max_tokens:
        description: "stage4, d3 and d3img: Groq tokens this invocation may spend"
        default: "60000"
      ref:
        description: "stage4: the full commit SHA to run on (run 1's corpus)"
        default: dca88926c45bea3f08af8fad8e666c275e297a41  # checkout needs all 40 characters
      cases:
        description: "t1: only these case ids, comma-separated (e.g. d1-054,d2-017); empty runs all 22"
        default: ""

concurrency:
  group: groq
  cancel-in-progress: false

permissions:
  contents: write  # to push the results branch

env:
  GROQ_MODEL: openai/gpt-oss-120b  # what run 1 and the prompt were measured with
  GROQ_FALLBACK_MODELS: qwen/qwen3.8-27b,openai/gpt-oss-20b
  MODELS_DIR: ${{ github.workspace }}/../models

jobs:
  stage4:
    if: inputs.job == 'stage4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      # main, for the model fetch script; the run itself is on `ref`, in run/
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: main
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref }}
          path: run
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e "run/backend[dev,experiments]"
      # The same bytes every M3 result was measured with, checked by SHA-256 as they stream.
      - name: Fetch the embedding model
        env:
          PYTHONPATH: main/backend
        run: python -m portfolio_agent.retrieval.fetch_model "$MODELS_DIR/multilingual-e5-small"
      # The embeddings run 1 was measured with, from the laptop's cache. They cannot be made
      # again: the quantized model scales each batch as a whole, so a text's vector depends on
      # the texts in its batch (up to 0.01 apart), and the cache was filled batch by batch over
      # stages 1-3. Fresh vectors here kept only 3 of run 2's 32 saved candidate lists.
      - name: Use run 1's embeddings
        run: |
          mkdir -p run/evals/.cache/embeddings
          cp main/evals/datasets/rerank/e5-small-embeddings.json \
             run/evals/.cache/embeddings/multilingual-e5-small.json
      # With no tokens to spend, every question without a usable saved ranking shows as
      # missing. A saved ranking is usable only if R3 gives the same candidates here as it did
      # on the laptop, so if any saved one is dropped, the run stops before paying for it again.
      - name: Check the saved rankings still apply
        working-directory: run/evals
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
          EMBEDDING_MODELS_DIR: ${{ env.MODELS_DIR }}
          RERANK_MAX_TOKENS: "0"
          GROQ_API_KEY_EVALS: unused
          RUN_NO: ${{ inputs.run }}
        run: |
          python -m retrieval.run_stage4 "$RUN_NO" | tail -n 1 > "$RUNNER_TEMP/check.json"
          python - <<'EOF'
          import json, os, pathlib
          status = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "check.json").read_text())
          saved = pathlib.Path(f"datasets/rerank/d1-dev-r4-run{os.environ['RUN_NO']}.json")
          have = len(json.loads(saved.read_text(encoding="utf-8"))["rankings"]) if saved.exists() else 0
          missing = len(status["missing"])
          print(f"saved {have}, missing {missing}")
          assert missing + have == 58, "saved rankings no longer match R3's candidates here"
          EOF
      - name: Rerank
        id: rerank
        working-directory: run/evals
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
          EMBEDDING_MODELS_DIR: ${{ env.MODELS_DIR }}
          RERANK_MAX_TOKENS: ${{ inputs.max_tokens }}
          GROQ_API_KEY_EVALS: ${{ secrets.GROQ_API_KEY_EVALS }}
          RUN_NO: ${{ inputs.run }}
        run: python -m retrieval.run_stage4 "$RUN_NO" | tee "$RUNNER_TEMP/stage4.txt"
      # Kept first as an artifact, so a failed push loses nothing (run 2's first rankings were
      # lost that way: groq #3).
      - name: Keep what the run saved
        if: always() && steps.rerank.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage4-run${{ inputs.run }}
          path: |
            run/evals/datasets/rerank/d1-dev-r4-run${{ inputs.run }}.json
            run/evals/results/
          if-no-files-found: warn
      # The branch starts from main, not from `ref`: a branch whose workflow files differ from
      # main's is refused to this token (it has no `workflows` permission).
      - name: Push the results branch
        if: always() && steps.rerank.outcome != 'skipped'
        working-directory: main
        env:
          RUN_NO: ${{ inputs.run }}
          BRANCH: groq/stage4-run${{ inputs.run }}-${{ github.run_id }}
        run: |
          mkdir -p evals/results
          cp ../run/evals/datasets/rerank/d1-dev-r4-run"$RUN_NO".json evals/datasets/rerank/
          cp ../run/evals/results/*-stage4-* evals/results/ 2>/dev/null || true
          git add -f evals/datasets/rerank evals/results
          if git diff --cached --quiet; then echo "nothing saved"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Stage 4 run $RUN_NO, from groq workflow run ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $BRANCH"
      - if: always()
        run: cat "$RUNNER_TEMP/stage4.txt" >> "$GITHUB_STEP_SUMMARY" || true

  t1:
    if: inputs.job == 't1'
    runs-on: ubuntu-latest
    # Results are written only at the end, so the limit must clear the longest run: the first
    # live run hit 90 minutes and saved nothing.
    timeout-minutes: 180
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
      EVAL_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
      EMBEDDING_MODEL_DIR: ${{ github.workspace }}/../models/multilingual-e5-small
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: evals/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: python -m portfolio_agent.retrieval.fetch_model
      # migrations, the C4 chunks with their vectors, and kb_version, as on Neon
      - run: python -m portfolio_agent.load
      - run: npm ci
        working-directory: evals
      # `cases` reruns only what a change touched: the whole T1 costs about 144K tokens (run 12),
      # a few cases about 6K each. Checked before any Groq call, so a typo spends nothing.
      - name: Pick the cases
        id: pick
        env:
          CASES: ${{ inputs.cases }}
        shell: bash
        run: |
          CASES="${CASES// /}"
          if [ -z "$CASES" ]; then echo "all cases"; exit 0; fi
          if ! [[ "$CASES" =~ ^d[0-9]-[0-9]{3}(,d[0-9]-[0-9]{3})*$ ]]; then
            echo "::error::cases must be ids like d1-054,d2-017"; exit 1
          fi
          echo "filter=^(${CASES//,/|})\$" >> "$GITHUB_OUTPUT"
          echo "cases: $CASES"
      - name: T1, live
        id: t1
        working-directory: evals
        env:
          GROQ_API_KEY_EVALS: ${{ secrets.GROQ_API_KEY_EVALS }}
          FILTER: ${{ steps.pick.outputs.filter }}
        shell: bash
        # A minute between cases: one heavy question nearly fills Groq's 8,000 tokens a minute, and
        # the next one would fall back to another model and measure that one instead.
        run: node answers/run.mjs t1 --no-cache --delay 60000 ${FILTER:+--filter-pattern "$FILTER"}
      - name: Keep what the run saved
        if: always() && steps.t1.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t1
          path: evals/results/promptfoo-t1-latest.json
          if-no-files-found: warn
      - name: Push the results branch
        if: always() && steps.t1.outcome != 'skipped'
        env:
          BRANCH: groq/t1-${{ github.run_id }}
        run: |
          git add -f evals/results/promptfoo-t1-latest.json || true
          if git diff --cached --quiet; then echo "nothing saved"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Live T1, from groq workflow run ${{ github.run_id }}"
          git push -q origin "HEAD:refs/heads/$BRANCH"
          echo "pushed $BRANCH"

  d3:
    if: inputs.job == 'd3'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent
      EMBEDDING_MODEL_DIR: ${{ github.workspace }}/../models/multilingual-e5-small
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: python -m portfolio_agent.retrieval.fetch_model
      - run: python -m portfolio_agent.load
      - name: D3, live
        id: d3
        working-directory: evals
        env:
          GROQ_API_KEY_EVALS: ${{ secrets.GROQ_API_KEY_EVALS }}
          JOBMATCH_MAX_TOKENS: ${{ inputs.max_tokens }}
        shell: bash  # with pipefail, so that tee does not hide a failure
        run: python -m jobmatch.run 2>&1 | tee "$RUNNER_TEMP/d3.txt"
      - name: Keep what the run saved
        if: always() && steps.d3.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d3
          path: evals/results/d3-live.json
          if-no-files-found: warn
      - if: always()
        run: cat "$RUNNER_TEMP/d3.txt" >> "$GITHUB_STEP_SUMMARY" || true

  d3img:
    if: inputs.job == 'd3img'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "backend[dev]"
      # The pictures are drawn with the Playwright of apps/web. Chromium only, as in ci.yml.
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install chromium
        working-directory: apps/web
        timeout-minutes: 5
      - name: Draw the postings
        working-directory: evals
        run: |
          echo "DRAWN=$RUNNER_TEMP/d3-pictures" >> "$GITHUB_ENV"
          python -m jobmatch.image_run --export "$RUNNER_TEMP/d3-pictures"
          node jobmatch/render.mjs "$RUNNER_TEMP/d3-pictures"
      - name: D3-img, live
        id: d3img
        working-directory: evals
        env:
          GROQ_API_KEY_EVALS: ${{ secrets.GROQ_API_KEY_EVALS }}
          JOBMATCH_IMAGE_MAX_TOKENS: ${{ inputs.max_tokens }}
        shell: bash  # with pipefail, so that tee does not hide a failure
        run: python -m jobmatch.image_run "$DRAWN" 2>&1 | tee "$RUNNER_TEMP/d3img.txt"
      - name: Keep what the run saved
        if: always() && steps.d3img.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d3img
          path: evals/results/d3-image.json
          if-no-files-found: warn
      - if: always()
        run: cat "$RUNNER_TEMP/d3img.txt" >> "$GITHUB_STEP_SUMMARY" || true
