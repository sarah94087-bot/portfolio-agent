[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Public AI agent that presents Sarah Halevy's work, with sources and a visible trace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "uvicorn>=0.32",
  "ruff==0.17.3",  # pinned so CI lints with the same rules as local
]

[tool.setuptools]
# Only the app package ships. migrations/ and tests/ sit next to it and are not packages.
packages = ["portfolio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
