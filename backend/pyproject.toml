[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Public AI agent that presents Sarah Halevy's work, with sources and a visible trace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  # The embeddings model runs in process (ADR-0012): about 115 MB with the model files.
  "numpy>=2,<3",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "uvicorn>=0.32",
  "ruff==0.17.3",  # pinned so CI lints with the same rules as local
]

# Only the app package and its subpackages ship, with the prompt files the agent reads at run
# time. migrations/ and tests/ sit next to it and are not packages.
[tool.setuptools.packages.find]
include = ["portfolio_agent", "portfolio_agent.*"]

[tool.setuptools.package-data]
"portfolio_agent.agent" = ["prompts/*.md"]

# The Vercel build (ADR-0012): the model files are not in the repo, so the build fetches them,
# checked against the pinned hashes. It runs after the dependencies are installed.
[tool.vercel.scripts]
build = "python -m portfolio_agent.retrieval.fetch_model --bundle"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
