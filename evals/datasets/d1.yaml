# D1 Golden set (docs/03-evaluation-methodology.md, section 2): 85 questions over the approved
# knowledge base. Gold chunks are C1 ids (<record>#<section>). Questions are worded the way a
# visitor would ask, not copied from the records; tests/test_d1.py checks the overlap.
# split: about 70% dev, 30% test. Test questions are not used for tuning.
# Labeled: every question, expected behavior and answer point approved by Sarah on 2026-11-04.

